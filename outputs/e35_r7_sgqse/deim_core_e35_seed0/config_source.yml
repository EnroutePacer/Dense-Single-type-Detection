__include__: [
  '../table_cells/dfine_hgnetv2_m_table_cell_fixed640.yml',
]

# Controlled 35-epoch DEIM-core baseline for table cells. Preserve the
# table-task model/query/size/optimizer contract and change only MAL + Dense O2O.
output_dir: ./output/e35_r7_sgqse/deim_core_e35_seed0
epoches: 35

DEIMCriterion:
  # YAML deep merge keeps the inherited loss_vfl key in the resolved
  # weight_dict. It is inactive because the dispatch list below contains MAL,
  # not VFL; this matches the official DEIM include-chain behavior.
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  small_object_weight: 1.0
  small_object_area_threshold: 0.0025
  small_object_box_weight: 1.0
  small_object_local_weight: 1.0

# The upstream M schedule [4,49,90] / 102 epochs is proportionally compressed
# to [1,17,31] / 35 epochs. Network input remains fixed at 640x640.
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [1, 17, 31]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    # Keep the 35-epoch controlled comparison on one continuous trajectory.
    # The upstream solver reloads best_stg1 exactly at stop_epoch.
    stop_epoch: 35
    final_size: null
    mixup_prob: 0.5
    mixup_epochs: [1, 17]
