__include__: ['../sgqs_e/b0_baseline.yml']

# Diagnostic comparator C3: add only Mosaic at p=0.5 during epochs 28--34.
# The network input remains fixed at 640x640 and MixUp stays disabled.
output_dir: ./output/e35_r7_sgqse/resume_c3_mosaic_only_seed0
epoches: 35

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: [28, 35, 35]
        ops: ['Mosaic']
      mosaic_prob: 0.5
