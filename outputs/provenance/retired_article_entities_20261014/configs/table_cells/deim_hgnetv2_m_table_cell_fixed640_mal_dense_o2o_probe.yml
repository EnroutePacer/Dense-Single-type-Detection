__include__: [
  './dfine_hgnetv2_m_table_cell_fixed640.yml',
]

# Controlled 12,800-step experiment derived explicitly from the official DEIM
# Dense O2O + MAL recipe. It intentionally does not include ../base/deim.yml,
# because that file also changes activation and LR scheduling.
output_dir: ./output/probe12800_fixed640_q640_deim_mal_dense_o2o

# Critical control variables (repeated here for auditability).
eval_spatial_size: [640, 640]
DFINETransformer:
  num_queries: 640
  activation: relu
  mlp_act: relu
PostProcessor:
  num_top_queries: 640

# Matchability-Aware Loss (MAL), copied from configs/base/deim.yml.
DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  small_object_weight: 1.0
  small_object_area_threshold: 0.0025
  small_object_box_weight: 1.0
  small_object_local_weight: 1.0

# Dense O2O augmentation, using the official DEIM-M stage boundaries.
# Network input remains fixed at 640x640; Mosaic internally composes at 320 and
# the dataset pipeline performs the single final resize to 640.
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [4, 49, 90]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    final_size: null
    mixup_prob: 0.5
    mixup_epochs: [4, 49]
    stop_epoch: 90

