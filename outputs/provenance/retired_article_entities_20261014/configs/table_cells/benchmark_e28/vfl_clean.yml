# Reproducible single-scale 640 D-FINE/VFL reference.
# epoches=28 trains epoch indices 0..27 and creates checkpoint0027.pth.
output_dir: ./output/benchmark_e28/vfl_clean_seed0
epoches: 28
checkpoint_freq: 4

eval_spatial_size: [640, 640]
DFINETransformer:
  num_queries: 640
  activation: relu
  mlp_act: relu
PostProcessor:
  num_top_queries: 640

