__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

# LEGACY ONLY: retained to reproduce the abandoned 640/704/800 experiment.
# Active experiments use dfine_hgnetv2_m_table_cell_fixed640.yml instead.

output_dir: ./output/dfine_hgnetv2_m_table_cell_probe800_weighted_singlepass
num_classes: 1
remap_mscoco_category: False
epoches: 120

DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1
  num_queries: 640

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

# Deliberately omit Resize here. BatchImageCollateFunction samples one target
# size and resizes each original-resolution image directly to that size once.
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: default
        epoch: 0
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: [640, 704, 800]
    scale_weights: [0.70, 0.10, 0.20]
    stop_epoch: 105
    final_size: 640
    mixup_prob: 0.0
    mixup_epochs: [0, 0]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size_repeat: null
    stop_epoch: null

PostProcessor:
  num_top_queries: 640
