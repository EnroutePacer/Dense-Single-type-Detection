__include__: [
  './dfine_hgnetv2_m_table_cell_fixed640.yml',
]

# Small-object-aware localization probe.
# Keep VFL unchanged; softly rebalance localization terms toward small cells.
# The weights are smooth in normalized box area and mean-normalized per match,
# so the total loss scale stays comparable to the fixed-640 control.
DEIMCriterion:
  small_object_weight: 1.0
  small_object_area_threshold: 0.0025
  small_object_box_weight: 1.30
  small_object_local_weight: 1.15
