__include__: ['../sgqs_e/b0_baseline.yml']

# Diagnostic comparator C4: retrofit MAL + the DEIM Dense-O2O augmentation
# path for the same seven resume epochs. This is not the formal from-start
# DEIM-core baseline; that role belongs to deim_core_e35.yml.
output_dir: ./output/e35_r7_sgqse/resume_c4_deim_core_seed0
epoches: 35

DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: [28, 35, 35]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    stop_epoch: 35
    final_size: null
    mixup_prob: 0.5
    mixup_epochs: [28, 35]
