__include__: [
  '../dfine_hgnetv2_m_table_cell_fixed640.yml',
]

# Mosaic-only: keep VFL and the clean recipe, adding only Mosaic.
# Epochs 0..3 are clean; Mosaic p=0.5 is active from epoch 4 onward.
output_dir: ./output/benchmark_e28/vfl_mosaic_only_seed0
epoches: 28
checkpoint_freq: 4

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: [4, 49, 90]
        ops: ['Mosaic']
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    stop_epoch: 105
    final_size: null
    mixup_prob: 0.0
    mixup_epochs: [0, 0]

