__include__: [
  '../dfine_hgnetv2_m_table_cell_fixed640.yml',
]

# MAL-only: identical to vfl_clean except for the classification loss.
output_dir: ./output/benchmark_e28/mal_clean_seed0
epoches: 28
checkpoint_freq: 4

DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  small_object_weight: 1.0
  small_object_area_threshold: 0.0025
  small_object_box_weight: 1.0
  small_object_local_weight: 1.0

