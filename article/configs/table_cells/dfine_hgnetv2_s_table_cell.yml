__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

# Single-class table-cell detection. Dataset paths are supplied by the launcher
# through -u and intentionally do not modify the generic custom_detection.yml.
output_dir: ./output/dfine_hgnetv2_s_table_cell
num_classes: 1
remap_mscoco_category: False
epoches: 120

DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1
  # merge_table_cell_coco.py allows up to 640 cells per image.
  num_queries: 640

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

# Table cells are regular, dense and often small. Keep only geometry-safe,
# appearance-only augmentation and fixed-size batches.
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: default
        epoch: 0
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: null
    mixup_prob: 0.0
    mixup_epochs: [0, 0]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size_repeat: null
    stop_epoch: null

PostProcessor:
  num_top_queries: 640
