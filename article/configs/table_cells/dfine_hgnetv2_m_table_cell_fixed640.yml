__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

# Canonical D-FINE-M table-cell control configuration.
# All active table-cell experiments should inherit this file directly.
output_dir: ./output/dfine_hgnetv2_m_table_cell_fixed640
num_classes: 1
remap_mscoco_category: False
epoches: 120
eval_spatial_size: [640, 640]

DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

DFINETransformer:
  num_layers: 4
  eval_idx: -1
  num_queries: 640
  activation: relu
  mlp_act: relu

PostProcessor:
  num_top_queries: 640

# Lock the checkpoint0027 training recipe for controlled resume probes.
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 500
flat_epoch: 4000000
no_aug_epoch: 0

# Plain VFL control. No custom small-object reweighting is active.
DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  small_object_weight: 1.0
  small_object_area_threshold: 0.0025
  small_object_box_weight: 1.0
  small_object_local_weight: 1.0

# Exactly one spatial resize: dataset image -> 640x640. The collate function
# only stacks equal-size tensors; it performs no scale sampling or interpolation.
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: default
        epoch: 0
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    stop_epoch: 105
    final_size: null
    mixup_prob: 0.0
    mixup_epochs: [0, 0]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    scales: null
    scale_weights: null
    stop_epoch: null
    final_size: null

