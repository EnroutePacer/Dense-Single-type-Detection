claims:
  - id: C-001
    status: target
    statement: "在固定 K=640 下，所提 selector/query initialization 提高 unique-GT coverage 并降低 selection starvation rate。"
    facts: []
    hypotheses: [H-001, H-002, H-003]
    experiments: [EXP-DIAG-003, EXP-ABL-001]
    protocols: [P-002]
    artifacts: []
    paper_locations: ["sec:diagnosis", "sec:method"]
    admission: "冻结模型、同 K、带 GT，对比 global Top-K、简单 calibration/quota、本文方法和 GT-aware oracle。"
    limitation: "selector coverage 提升本身不代表最终 AP 提升。"

  - id: C-002
    status: target
    statement: "coverage 改善能转化为相同 epoch/steps 下更高的检测 AP/AR。"
    facts: []
    hypotheses: [H-001, H-002]
    experiments: [EXP-TRAIN-001, EXP-TRAIN-002, EXP-TRAIN-003]
    protocols: [P-001, P-003]
    artifacts: []
    paper_locations: ["tab:main-results", "fig:convergence"]
    admission: "相同初始化、global batch、优化器、调度、seed 和 maxDets=300；至少三个 seed。"
    limitation: "当前训练暂停，尚无支持证据。"

  - id: C-003
    status: target
    statement: "改进没有把错误从 selection 转移至 decoder 或 output。"
    facts: [F-022, F-023]
    hypotheses: [H-004]
    experiments: [EXP-DIAG-003, EXP-DIAG-004, EXP-DIAG-006]
    protocols: [P-002]
    artifacts: [ART-000094]
    paper_locations: ["fig:stage-survival"]
    admission: "报告 generation、selection、各 decoder layer、output 的逐阶段 GT coverage，并检查重复框、FP 和校准。"
    limitation: "本地 SGQS full-val 已显示倒 U 主要由 output Top-300 admission 承载，但缺同口径受控 baseline 和多 seed；该观察不能满足‘没有转移错误’的主张。"

  - id: C-004
    status: target
    statement: "收益主要出现在密集、短边小或细长目标，且不明显损害其他分桶。"
