    protocols: [P-002, P-003]
    artifacts: [ART-000094]
    paper_locations: ["tab:stratified-results"]
    admission: "预注册密度、短边、面积、长宽比分桶，并给出样本数、均值和方差。"
    limitation: "本地 full-val 只定位 SGQS epoch 轨迹的变化人群，未证明相对 baseline 的方法收益或其他分桶无损；密度与短边分桶重叠，P3 来源和 predicted-small 也不能替代 GT 分桶。"

