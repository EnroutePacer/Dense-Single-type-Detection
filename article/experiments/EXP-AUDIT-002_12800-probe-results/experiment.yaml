audit_conclusion:
  numerical_record: >-
    三个摘要均低于起始 checkpoint。按摘要数值，small_reg 相对 control 的
    mAP 高 0.000514，但 AP_small 和 AR_small 均低 0.002；MAL + Dense O2O
    相对 control 的 mAP 低 0.009203，所有分尺度 AP/AR 均下降。
  allowed_claim: >-
    可以陈述上述摘要中的数值关系，以及 small_reg 未表现出小框指标收益、
    MAL + Dense O2O 摘要结果整体更差。
  prohibited_claim: >-
    在补齐原始 console、运行时 cfg 和 loss 字段前，不得宣称差异由 small-reg、
    MAL、Mosaic、MixUp 或其他具体配置改动造成。
  upgrade_requirements:
    - "补回每个 run 的 console.log 和 log.txt"
    - "核对启动行中的 config 路径和 train.py 输出的 cfg:"
    - "确认 control/small_reg 日志含 loss_vfl，MAL 日志含 loss_mal"
    - "核对 small-reg 权重以及 Mosaic/MixUp 的运行时配置"

notes: >-
  AP75、分尺度 AP/AR 和 recall 只保留三位小数，约 0.001 以内差异可能受打印
  舍入影响。mAP 和 AP50 使用 quick-probe 摘要中的六位小数。
