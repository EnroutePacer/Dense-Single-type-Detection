  missing_end_to_end_supervision:
    status: supported_as_proxy_mismatch
    supported: "SGQS proxies improve while final Top-300 AP-small falls."
    rejected_or_open: "No e31 base-loss rebound; validation AP-large cannot trigger training loss."
  equal_level_dense_normalization:
    status: mechanism_confirmed_causality_open
    supported: "Per-level means are averaged equally; rare P5 positives have larger explicit per-positive normalizers."
    rejected_or_open: "Per-level shared-parameter gradients and optimizer updates were not measured."

